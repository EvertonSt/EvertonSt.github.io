    <!--
      Content Security Policy.

      GitHub Pages cannot set response headers, so a meta element is the only
      place a policy can live for this deployment. Two consequences are accepted
      deliberately rather than hidden:

      - `frame-ancestors` and `form-action` are ignored in a meta policy, so they
        appear only in `public/_headers`, which a CDN that can set them will
        honour. The site frames nothing and posts nothing, so nothing is lost.
      - `script-src` needs `'unsafe-inline'` because the structured data below is
        an inline JSON-LD block, which is the form search engines require and the
        only script on the page. Every executable script is emitted by the build
        as an external module from this origin, so the practical exposure is the
        JSON-LD block alone.

      `public/_headers` carries the strict version, including
      `frame-ancestors 'none'`, for any future host that can set headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
    />
