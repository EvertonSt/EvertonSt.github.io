<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Everton S. Andrade</title>
  <script>
    // GitHub Pages SPA redirect: store the path and redirect to index
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0f;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container { max-width: 500px; padding: 2rem; }
    h1 { font-size: 4rem; margin: 0; background: linear-gradient(135deg, #4f8fff, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #a0a0b0; margin: 1rem 0 2rem; font-size: 1.1rem; }
    a { color: #8b5cf6; text-decoration: none; font-weight: 600; }
    a:hover { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>This page doesn't exist. Let's get you back on track.</p>
    <a href="/">← Back to portfolio</a>
  </div>
</body>
</html>
