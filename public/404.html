<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Everton S. Andrade</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0b12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      A real 404 page, not an SPA redirect.

      The previous version rewrote the URL to /?/<path> and let the single-page
      app render, on the assumption a router would pick the route up. There is
      no router on this site, so that redirect turned a 404 into a 200 at the
      home page: search engines were told the broken URL existed, and a visitor
      who mistyped a link got the portfolio instead of being told what happened.
      Keeping the status and showing the link list is both more useful and more
      honest.

      Inlined rather than linked: a 404 page is served when the hashed bundle may
      itself be what is missing, so it must not depend on a stylesheet request
      succeeding.
    -->
    <style>
      :root {
        --bg-primary: #0b0b12;
        --bg-card: #12121b;
        --border-subtle: #20202d;
        --text-primary: #f3f3f7;
        --text-secondary: #b6b6c6;
        --text-muted: #8e8ea0;
        --accent-violet: #a78bfa;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg-primary: #ffffff;
          --bg-card: #f6f7fb;
          --border-subtle: #e2e5ef;
          --text-primary: #14161f;
          --text-secondary: #3d4356;
          --text-muted: #5b6178;
          --accent-violet: #6d28d9;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg-primary);
        color: var(--text-secondary);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
      }

      main {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }

      .code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 4rem;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, #6ea8ff, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1 {
        margin-top: 0.75rem;
        font-size: 1.5rem;
        color: var(--text-primary);
      }

      p {
        margin-top: 0.75rem;
      }

      ul {
        display: grid;
        gap: 0.5rem;
        margin-top: 1.75rem;
        padding: 1.25rem;
        list-style: none;
        text-align: left;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 0.75rem;
      }

      a {
        color: var(--accent-violet);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .note {
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page does not exist</h1>
      <p>The link may be out of date, or the address may have a typo in it.</p>

      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/#work">Selected work</a></li>
        <li><a href="/#resume">Résumé</a></li>
        <li><a href="/#contact">Contact</a></li>
        <li><a href="/everton-s-andrade-resume.pdf">Résumé (PDF)</a></li>
        <li><a href="https://github.com/EvertonSt">GitHub</a></li>
      </ul>

      <p class="note">Everton S. Andrade — QA Automation Engineer &amp; SDET</p>
    </main>
  </body>
</html>
