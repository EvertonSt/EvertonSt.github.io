<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8fff"/>
      <stop offset="50%" stop-color="#7c6aff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4f8fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Subtle glow -->
  <ellipse cx="32" cy="28" rx="20" ry="18" fill="url(#glow)"/>
  <!-- Letter E -->
  <text x="32" y="44" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="38" font-weight="800" fill="url(#accent)" text-anchor="middle">E</text>
  <!-- Bottom accent bar -->
  <rect x="0" y="58" width="64" height="6" rx="0" fill="url(#accent)" opacity="0.4"/>
</svg>
