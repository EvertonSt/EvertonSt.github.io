<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8fff"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#4f8fff;stop-opacity:0.03"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  
  <!-- Subtle gradient glow -->
  <ellipse cx="300" cy="250" rx="400" ry="300" fill="url(#glow)"/>
  
  <!-- Top accent line -->
  <rect x="80" y="80" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  
  <!-- Name -->
  <text x="80" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#f0f0f5">Everton S. Andrade</text>
  
  <!-- Title -->
  <text x="80" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8b5cf6">AI QA Engineer · SDET · Quality Engineering</text>
  
  <!-- Separator line -->
  <rect x="80" y="220" width="1040" height="1" fill="#1e1e2a"/>
  
  <!-- Tagline -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#a0a0b0">Building systems that make software quality</text>
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#a0a0b0">observable, repeatable, and harder to ignore.</text>
  
  <!-- Tech tags -->
  <g transform="translate(80, 340)">
